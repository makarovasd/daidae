<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多人同步拼图</title>
<style>
*{box-sizing:border-box}
body{padding:20px;font-family:system-ui}
#grid{display:grid;grid-template-columns: repeat(8, 1fr);gap:2px;width:600px}
.cell{border:2px solid transparent;cursor:pointer;background-size:600px 600px}
.cell.active{border-color:#ff3333;box-shadow:0 0 4px #ff3333}
button{padding:8px 14px;font-size:16px;margin-right:8px;margin-bottom:10px}
#status{color:#444}
</style>
</head>
<body>
<button id="shuffleBtn">随机打乱（保留高亮）</button>
<span id="status">等待加载图片...</span>
<div id="grid"></div>

<script>
const GRID_SIZE = 8;
const TOTAL = GRID_SIZE * GRID_SIZE;
// =========这里换成你自己的jsonbin信息========
const BIN_ID = "在这里填bin id";
const ACCESS_KEY = "在这里填X-Access-Key";
// ==========================================

let img = new Image();
img.src = "pic.png";
let cellW, cellH;
let state = {
  order: [],
  active: []
};
let isUploading = false;
const gridEl = document.getElementById("grid");
const statusEl = document.getElementById("status");

function render(){
  gridEl.innerHTML = "";
  for(let i=0;i<TOTAL;i++){
    const div = document.createElement("div");
    div.className = "cell";
    if(state.active.includes(i)) div.classList.add("active");
    div.style.width = cellW + "px";
    div.style.height = cellH + "px";
    const idx = state.order[i];
    const sx = (idx % GRID_SIZE) * cellW;
    const sy = Math.floor(idx / GRID_SIZE) * cellH;
    div.style.backgroundImage = `url(pic.png)`;
    div.style.backgroundPosition = `-${sx}px -${sy}px`;
    div.style.backgroundSize = `${GRID_SIZE*cellW}px ${GRID_SIZE*cellH}px`;
    div.onclick = ()=>{
      let p = state.active.indexOf(i);
      if(p >= 0) state.active.splice(p,1);
      else state.active.push(i);
      render();
      saveToCloud();
    }
    gridEl.appendChild(div);
  }
}

async function saveToCloud(){
  if(isUploading) return;
  isUploading = true;
  statusEl.textContent = "正在同步...";
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method:"PUT",
      headers:{
        "X-Access-Key": ACCESS_KEY,
        "Content-Type":"application/json"
      },
      body: JSON.stringify(state)
    });
    if(res.ok){
      statusEl.textContent = "✅ 同步成功";
    }else{
      statusEl.textContent = "❌ 同步失败";
    }
  }catch(e){
    statusEl.textContent = "❌ 网络错误";
    console.error(e);
  }
  isUploading = false;
}

async function loadFromCloud(){
  statusEl.textContent = "拉取云端数据...";
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method:"GET",
      headers:{
        "X-Access-Key": ACCESS_KEY
      }
    });
    const ret = await res.json();
    if(ret.record){
      state = ret.record;
      if(!state.order || state.order.length!==TOTAL){
        state.order = Array.from({length:TOTAL}, (_,i)=>i);
        state.active = [];
      }
      render();
      statusEl.textContent = "✅ 已同步";
    }else{
      statusEl.textContent = "❌ 获取失败";
    }
  }catch(e){
    statusEl.textContent = "❌ 获取失败";
    console.error(e);
  }
}

document.getElementById("shuffleBtn").onclick = ()=>{
  let arr = [...state.order];
  for(let i=arr.length-1;i>0;i--){
    let j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  state.order = arr;
  render();
  saveToCloud();
}

img.onload = ()=>{
  cellW = img.width / GRID_SIZE;
  cellH = img.height / GRID_SIZE;
  loadFromCloud();
  setInterval(loadFromCloud, 2000);
}
img.onerror = ()=>{
  statusEl.textContent = "❌ 找不到 pic.png";
}
</script>
</body>
</html>
