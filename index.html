<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拼图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#grid{
  display:grid;
  grid-template-columns: repeat(8, auto);
  gap:6px;               /* 格子之间留缝，让每个边框各自独立，不会并成一条线 */
  margin-bottom:20px;
}
.cell{
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background-repeat:no-repeat;
  background-color:#121212;
  border:1px solid rgba(255,255,255,.28);  /* 每格自己的边框：改这里即可调粗细和颜色 */
  border-radius:2px;
}
.cell.active::after{
  content:"";
  position:absolute;
  inset:4px;
  border:2px solid #ff3333;
  box-shadow:0 0 6px rgba(255,40,40,0.7);
  pointer-events:none;
}
#shuffleBtn{
  width:140px;
  height:52px;
  border:none;
  border-radius:14px;
  background:linear-gradient(180deg, #bff559 0%, #78d320 45%, #5bb518 55%, #469b12 100%);
  color:#fff;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
  position:relative;
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.45),
    inset 0 -5px 0 rgba(0,0,0,.25),
    0 4px 0 #1f4d08,
    0 6px 10px rgba(0,0,0,.35);
  text-shadow:
    0 2px 0 #3f8010,
    0 0 4px rgba(0,0,0,.4);
  transition:transform .08s ease;
}
#shuffleBtn:hover{
  filter:brightness(1.08);
}
#shuffleBtn:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    inset 0 -4px 0 rgba(0,0,0,.25),
    0 2px 0 #1f4d08,
    0 3px 6px rgba(0,0,0,.35);
}
</style>
</head>
<body>
<div id="grid"></div>
<button id="shuffleBtn">随机</button>
<script>
/* pic.png 本身是 8 列 × 8 行，每格四周有一圈浅灰白描边。
   以前按 9 列切，每一格里都会带进一段白线；
   现在按图片真实的 8 列来切，并把裁剪框往里收，把白边整条裁掉。 */
const COLS = 8;
const ROWS = 8;
const total = COLS * ROWS;
const gridEl = document.getElementById("grid");

// 原图每格左边/上边那条白边所占的宽度，裁剪时跳过它
const INSET = 12;
// 右边/下边再往里收一点，避免把白边的抗锯齿边缘带进来
const TRIM = 2.5;

let img = new Image();
img.src = "pic.png";

let pitchX = 0, pitchY = 0;      // 原图一格的宽、高
let cropW = 0, cropH = 0;        // 每格真正裁出来的尺寸
let cellW = 0, cellH = 0;        // 屏幕上一格的显示尺寸
let scaleX = 1, scaleY = 1;      // 背景图放大倍数

let order = [];
let activeItemSet = new Set();

function draw(){
  gridEl.innerHTML = "";
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellW}px)`;
  gridEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellH}px)`;

  for(let screenIdx = 0; screenIdx < total; screenIdx++){
    const itemId = order[screenIdx];
    const div = document.createElement("div");
    div.className = activeItemSet.has(itemId) ? "cell active" : "cell";
    div.style.width = cellW + "px";
    div.style.height = cellH + "px";

    const col = itemId % COLS;
    const row = (itemId - col) / COLS;

    // 跳过描边后的裁剪起点 + 背景图放大后的偏移
    const sx = col * pitchX + INSET;
    const sy = row * pitchY + INSET;

    div.style.backgroundImage = "url('pic.png')";
    div.style.backgroundSize = `${img.width * scaleX}px ${img.height * scaleY}px`;
    div.style.backgroundPosition = `${-sx * scaleX}px ${-sy * scaleY}px`;

    div.onclick = ()=>{
      if(activeItemSet.has(itemId)){
        activeItemSet.delete(itemId);
      }else{
        activeItemSet.add(itemId);
      }
      draw();
    };

    gridEl.appendChild(div);
  }
}

document.getElementById("shuffleBtn").onclick = ()=>{
  const arr = [...order];
  for(let i = arr.length - 1; i > 0; i--){
    const r = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[r]] = [arr[r], arr[i]];
  }
  order = arr;
  draw();
};

img.onload = function(){
  pitchX = img.width / COLS;
  pitchY = img.height / ROWS;
  cropW = pitchX - INSET - TRIM;
  cropH = pitchY - INSET - TRIM;

  // 屏幕上每格保持原来的大小，把裁出的区域放大铺满
  cellW = Math.round(pitchX);
  cellH = Math.round(pitchY);
  scaleX = cellW / cropW;
  scaleY = cellH / cropH;

  order = Array.from({length: total}, (_, i) => i);
  activeItemSet.clear();
  draw();
};

img.onerror = function(){
  alert("❌ pic.png 加载失败！确认图片上传、文件名小写 pic.png");
};
</script>
</body>
</html>
