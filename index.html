<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>呆大鹅电竞随机三连Bingo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(760px 340px at 50% -4%, rgba(255,168,52,.18), transparent 65%),
    radial-gradient(1100px 560px at 50% -12%, rgba(96,72,255,.18), transparent 62%),
    radial-gradient(900px 460px at 50% 112%, rgba(0,200,255,.10), transparent 62%),
    #050507;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  justify-content:safe center;   /* 内容比窗口高时改为顶部对齐，标题不会被挤出屏幕 */
  padding:24px 20px 36px;
}

/* ===== 顶部招牌（卡通木板底座） ===== */
#hero{
  display:flex;
  justify-content:center;
  margin-bottom:26px;
  animation:heroIn .7s ease both;
}
@keyframes heroIn{
  from{opacity:0; transform:translateY(-10px)}
  to{opacity:1; transform:none}
}
.banner{
  position:relative;
  display:inline-block;
  padding:0 30px;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.58));
}
/* 两侧橙红飘带：先画，被招牌压住大半，只露出两端 */
.wing{
  position:absolute;
  top:22%;
  height:56%;
  width:60px;
  border:6px solid #2a1a0d;
  border-radius:16px 10px 10px 16px;
  background:linear-gradient(180deg,#f3972e 0%,#e2761a 52%,#b9530f 100%);
}
.wing.left{ left:-24px; transform:rotate(-4deg); }
.wing.right{ right:-24px; transform:rotate(4deg) scaleX(-1); }
.plate{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:18px 58px 20px;
  border-radius:30px;
  border:7px solid #2a1a0d;
  background:linear-gradient(180deg,#ffe98c 0%,#ffd04a 26%,#ffbe2a 64%,#efa012 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.9),
    inset 0 13px 22px rgba(255,255,255,.28),
    inset 0 -12px 0 rgba(170,88,0,.26);
  overflow:hidden;
}
.plate::after{
  content:"";
  position:absolute;
  inset:-50% -40%;
  background:linear-gradient(105deg, transparent 42%, rgba(255,255,255,.5) 50%, transparent 58%);
  animation:sweep 7s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{
  0%{transform:translateX(-55%)}
  55%,100%{transform:translateX(55%)}
}
.title{
  position:relative;
  z-index:1;
  margin:0;
  font-size:clamp(24px, 3.5vw, 44px);
  font-weight:900;
  line-height:1.18;
  letter-spacing:.04em;
  white-space:nowrap;
  color:#fff;
  -webkit-text-stroke:7px #241506;
  paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(60,28,0,.32);
}
.title .bingo{
  font-style:italic;
  letter-spacing:.01em;
  margin-left:.14em;
}

#grid{
  display:grid;
  grid-template-columns: repeat(8, auto);
  gap:6px;               /* 格子之间留缝，让每个边框各自独立，不会并成一条线 */
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.008));
  box-shadow:
    0 0 0 1px rgba(0,0,0,.7),
    0 26px 70px rgba(0,0,0,.6),
    0 0 70px rgba(90,120,255,.10);
  margin-bottom:24px;
}
@media (prefers-reduced-motion: reduce){
  #hero,.plate::after{animation:none}
}
.cell{
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background-repeat:no-repeat;
  background-color:#121212;
  border:1px solid rgba(255,255,255,.28);  /* 每格自己的边框：改这里即可调粗细和颜色 */
  border-radius:2px;
}
.cell.active::after{
  content:"";
  position:absolute;
  inset:4px;
  border:2px solid #ff3333;
  box-shadow:0 0 6px rgba(255,40,40,0.7);
  pointer-events:none;
}
#shuffleBtn{
  width:152px;
  height:56px;
  border-radius:18px;
  border:4px solid #2a1a0d;
  background:linear-gradient(180deg,#ffe98c 0%,#ffd04a 26%,#ffbe2a 64%,#efa012 100%);
  color:#fff;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
  position:relative;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 8px 14px rgba(255,255,255,.25),
    inset 0 -8px 0 rgba(170,88,0,.26),
    0 5px 0 #2a1a0d,
    0 10px 20px rgba(0,0,0,.5),
    0 0 28px rgba(255,170,50,.35);
  -webkit-text-stroke:2.5px #241506;
  paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(60,28,0,.35);
  transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
}
#shuffleBtn:hover{
  filter:brightness(1.06);
  transform:translateY(-1px);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.95),
    inset 0 8px 14px rgba(255,255,255,.28),
    inset 0 -8px 0 rgba(170,88,0,.26),
    0 6px 0 #2a1a0d,
    0 13px 24px rgba(0,0,0,.55),
    0 0 40px rgba(255,180,60,.5);
}
#shuffleBtn:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -6px 0 rgba(170,88,0,.3),
    0 2px 0 #2a1a0d,
    0 4px 10px rgba(0,0,0,.45),
    0 0 22px rgba(255,170,50,.3);
}
</style>
</head>
<body>
<header id="hero">
  <div class="banner">
    <span class="wing left" aria-hidden="true"></span>
    <span class="wing right" aria-hidden="true"></span>
    <div class="plate">
      <h1 class="title">呆大鹅电竞随机三连<span class="bingo">Bingo</span></h1>
    </div>
  </div>
</header>
<div id="grid"></div>
<button id="shuffleBtn">随机</button>
<script>
/* pic.png 本身是 8 列 × 8 行，每格四周有一圈浅灰白描边。
   以前按 9 列切，每一格里都会带进一段白线；
   现在按图片真实的 8 列来切，并把裁剪框往里收，把白边整条裁掉。 */
const COLS = 8;
const ROWS = 8;
const total = COLS * ROWS;
const gridEl = document.getElementById("grid");

// 原图每格左边/上边那条白边所占的宽度，裁剪时跳过它
const INSET = 12;
// 右边/下边再往里收一点，避免把白边的抗锯齿边缘带进来
const TRIM = 2.5;

let img = new Image();
img.src = "pic.png";

let pitchX = 0, pitchY = 0;      // 原图一格的宽、高
let cropW = 0, cropH = 0;        // 每格真正裁出来的尺寸
let cellW = 0, cellH = 0;        // 屏幕上一格的显示尺寸
let scaleX = 1, scaleY = 1;      // 背景图放大倍数

let order = [];
let activeItemSet = new Set();

function draw(){
  gridEl.innerHTML = "";
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellW}px)`;
  gridEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellH}px)`;

  for(let screenIdx = 0; screenIdx < total; screenIdx++){
    const itemId = order[screenIdx];
    const div = document.createElement("div");
    div.className = activeItemSet.has(itemId) ? "cell active" : "cell";
    div.style.width = cellW + "px";
    div.style.height = cellH + "px";

    const col = itemId % COLS;
    const row = (itemId - col) / COLS;

    // 跳过描边后的裁剪起点 + 背景图放大后的偏移
    const sx = col * pitchX + INSET;
    const sy = row * pitchY + INSET;

    div.style.backgroundImage = "url('pic.png')";
    div.style.backgroundSize = `${img.width * scaleX}px ${img.height * scaleY}px`;
    div.style.backgroundPosition = `${-sx * scaleX}px ${-sy * scaleY}px`;

    div.onclick = ()=>{
      if(activeItemSet.has(itemId)){
        activeItemSet.delete(itemId);
      }else{
        activeItemSet.add(itemId);
      }
      draw();
    };

    gridEl.appendChild(div);
  }
}

document.getElementById("shuffleBtn").onclick = ()=>{
  const arr = [...order];
  for(let i = arr.length - 1; i > 0; i--){
    const r = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[r]] = [arr[r], arr[i]];
  }
  order = arr;
  draw();
};

img.onload = function(){
  pitchX = img.width / COLS;
  pitchY = img.height / ROWS;
  cropW = pitchX - INSET - TRIM;
  cropH = pitchY - INSET - TRIM;

  // 屏幕上每格保持原来的大小，把裁出的区域放大铺满
  cellW = Math.round(pitchX);
  cellH = Math.round(pitchY);
  scaleX = cellW / cropW;
  scaleY = cellH / cropH;

  order = Array.from({length: total}, (_, i) => i);
  activeItemSet.clear();
  draw();
};

img.onerror = function(){
  alert("❌ pic.png 加载失败！确认图片上传、文件名小写 pic.png");
};
</script>
</body>
</html>
