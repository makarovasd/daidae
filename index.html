<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拼图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#shuffleBtn{
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  margin-bottom:16px;
}
#grid{
  display:grid;
  grid-template-columns: repeat(8, 1fr);
  gap:2px;
}
.cell{
  border:2px solid transparent;
  cursor:pointer;
}
.cell.active{
  border-color:#ff3333;
  box-shadow:0 0 4px #ff3333;
}
</style>
</head>
<body>
<button id="shuffleBtn">随机</button>
<div id="grid"></div>

<script>
const GRID = 8;
const total = GRID * GRID;
const gridEl = document.getElementById("grid");

let img = new Image();
img.src = "pic.png";

let cellW = 0;
let cellH = 0;
let order = [];
let active = [];

function draw(){
  gridEl.innerHTML = "";
  gridEl.style.width = (cellW * GRID + 2*(GRID-1)) + "px";

  for(let i=0;i<total;i++){
    const div = document.createElement("div");
    div.className = "cell";
    if(active.includes(i)) div.classList.add("active");
    div.style.width = cellW + "px";
    div.style.height = cellH + "px";

    const idx = order[i];
    const x = (idx % GRID) * cellW;
    const y = Math.floor(idx / GRID) * cellH;

    div.style.backgroundImage = `url(pic.png)`;
    div.style.backgroundPosition = `-${x}px -${y}px`;
    div.style.backgroundSize = `${img.width}px ${img.height}px`;

    div.onclick = ()=>{
      let pos = active.indexOf(i);
      if(pos >= 0) active.splice(pos,1);
      else active.push(i);
      draw();
    }
    gridEl.appendChild(div);
  }
}

// 洗牌
document.getElementById("shuffleBtn").onclick = ()=>{
  let arr = [...order];
  for(let i=arr.length-1;i>0;i--){
    let r = Math.floor(Math.random()*(i+1));
    [arr[i],arr[r]] = [arr[r],arr[i]];
  }
  order = arr;
  draw();
}

img.onload = function(){
  console.log("图片加载成功，宽：", img.width, "高：", img.height);
  cellW = img.width / GRID;
  cellH = img.height / GRID;
  // 初始化顺序
  order = [];
  for(let i=0;i<total;i++) order.push(i);
  active = [];
  draw();
}

img.onerror = function(){
  alert("❌ pic.png 加载失败！\n检查：\n1. 图片已经上传到仓库根目录\n2. 文件名字严格是 pic.png，大小写不能错\n3. 和 index.html 放在同一文件夹");
}
</script>
</body>
</html>
