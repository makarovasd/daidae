<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拼图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#grid{
  display:grid;
  grid-template-columns: repeat(8, 1fr);
  gap:2px;
  margin-bottom:20px;
}
.cell{
  border:2px solid transparent;
  cursor:pointer;
}
.cell.active{
  border-color:#ff3333;
  box-shadow:0 0 4px #ff3333;
}
#shuffleBtn{
  width:140px;
  height:52px;
  border:none;
  border-radius:14px;
  background:linear-gradient(180deg, #bff559 0%, #78d320 45%, #5bb518 55%, #469b12 100%);
  color:#fff;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
  position:relative;
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.45),
    inset 0 -5px 0 rgba(0,0,0,.25),
    0 4px 0 #1f4d08,
    0 6px 10px rgba(0,0,0,.35);
  text-shadow:
    0 2px 0 #3f8010,
    0 0 4px rgba(0,0,0,.4);
  transition:transform .08s ease;
}
#shuffleBtn:hover{
  filter:brightness(1.08);
}
#shuffleBtn:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 4px 0 rgba(255,255,255,.35),
    inset 0 -4px 0 rgba(0,0,0,.25),
    0 2px 0 #1f4d08,
    0 3px 6px rgba(0,0,0,.35);
}
</style>
</head>
<body>
<div id="grid"></div>
<button id="shuffleBtn">随机</button>

<script>
const GRID = 8;
const total = GRID * GRID;
const gridEl = document.getElementById("grid");

let img = new Image();
img.src = "pic.png";

let cellW = 0;
let cellH = 0;
let order = [];
let active = [];

function draw(){
  gridEl.innerHTML = "";
  gridEl.style.width = (cellW * GRID + 2 * (GRID - 1)) + "px";

  for(let i = 0; i < total; i++){
    const div = document.createElement("div");
    div.className = "cell";
    if(active.includes(i)) div.classList.add("active");
    div.style.width = cellW + "px";
    div.style.height = cellH + "px";

    const idx = order[i];
    const x = (idx % GRID) * cellW;
    const y = Math.floor(idx / GRID) * cellH;

    div.style.backgroundImage = `url(pic.png)`;
    div.style.backgroundPosition = `-${x}px -${y}px`;
    div.style.backgroundSize = `${img.width}px ${img.height}px`;

    div.onclick = ()=>{
      const pos = active.indexOf(i);
      if(pos >= 0) active.splice(pos, 1);
      else active.push(i);
      draw();
    };

    gridEl.appendChild(div);
  }
}

document.getElementById("shuffleBtn").onclick = ()=>{
  const arr = [...order];
  for(let i = arr.length - 1; i > 0; i--){
    const r = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[r]] = [arr[r], arr[i]];
  }
  order = arr;
  draw();
};

img.onload = function(){
  cellW = img.width / GRID;
  cellH = img.height / GRID;
  order = [];
  for(let i = 0; i < total; i++) order.push(i);
  active = [];
  draw();
};

img.onerror = function(){
  alert("❌ pic.png 加载失败！\n请确认图片已上传到仓库根目录，且文件名为 pic.png");
};
</script>
</body>
</html>
